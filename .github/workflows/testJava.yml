name: Java CI with Maven

on:
  push:
    branches: [ "master", "main", "KhanbanTasks-Part2" ]
  pull_request:
    branches: [ "master", "main", "KhanbanTasks-Part2" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 26
      uses: actions/setup-java@v4
      with:
        java-version: '26'
        distribution: 'temurin'
        cache: maven
        
    - name: Run Unit Tests with Maven
      run: mvn test